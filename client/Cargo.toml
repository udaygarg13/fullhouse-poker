[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
dioxus = { version = "0.7.4", features = ["web"] }
futures = "0.3"
futures-util = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
gloo-net = { version = "0.6", features = ["websocket"] }
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.4", features = ["futures"] }
chrono = "0.4.44"

[build-dependencies]
dotenvy = "0.15.7"
